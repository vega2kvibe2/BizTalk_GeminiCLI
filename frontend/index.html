<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 - 비즈니스 커뮤니케이션 도우미</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007bff',
                        'primary-dark': '#0056b3',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-8">
    <div class="container max-w-2xl w-full bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-6 sm:p-10 border border-slate-100">
        <header class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3 flex items-center justify-center gap-2">
                <span class="text-4xl">💼</span> 업무 말투 변환기
            </h1>
            <p class="text-slate-500 font-medium">일상적인 말투를 격식 있는 비즈니스 언어로 변환해 드립니다.</p>
        </header>

        <main class="space-y-8">
            <section class="space-y-3">
                <label for="inputText" class="block text-sm font-bold text-slate-700 ml-1">원문 입력</label>
                <textarea id="inputText" 
                    class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 placeholder-slate-400 text-slate-700 leading-relaxed"
                    placeholder="변환할 내용을 입력하세요. (예: 내일까지 보고서 제출 어려울 것 같음)"></textarea>
            </section>

            <section class="space-y-3">
                <label class="block text-sm font-bold text-slate-700 ml-1">수신 대상 선택</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button class="target-btn px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200" data-target="boss">상사 / 임원</button>
                    <button class="target-btn px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200" data-target="colleague">타팀 동료</button>
                    <button class="target-btn px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200" data-target="client">고객 / 외부</button>
                    <button class="target-btn px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200" data-target="team">팀 내 동료</button>
                </div>
            </section>

            <div class="flex justify-center pt-4">
                <button id="convertBtn" 
                    class="px-10 py-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-full shadow-lg shadow-primary/25 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                    AI 변환하기
                </button>
            </div>

            <section class="space-y-3">
                <label for="outputText" class="block text-sm font-bold text-slate-700 ml-1">변환 결과</label>
                <div class="relative group">
                    <textarea id="outputText" readonly 
                        class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none text-slate-700 leading-relaxed cursor-default"
                        placeholder="변환 결과가 여기에 표시됩니다."></textarea>
                    
                    <div id="loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-[2px] rounded-xl flex flex-col items-center justify-center space-y-3 z-10 transition-opacity duration-300">
                        <div class="spinner w-10 h-10 border-4 border-slate-100 border-t-primary rounded-full animate-spin"></div>
                        <p class="text-sm font-bold text-slate-600">AI가 변환 중입니다...</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button id="copyBtn" 
                        class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold rounded-lg shadow-md shadow-emerald-500/20 transition-all duration-200 flex items-center gap-2">
                        <span>📋</span> 결과 복사하기
                    </button>
                </div>
            </section>
        </main>

        <footer class="mt-12 text-center text-slate-400 text-xs font-medium">
            <p>&copy; 2026 업무 말투 변환기. Powered by Upstage Solar-Pro2</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
